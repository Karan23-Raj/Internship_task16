
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KARAN - Smart Calculator</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="main-container">

        <!-- Calculator Section -->

        <div class="calculator">

            <!-- Header -->

            <div class="header">

                <div>
                    <p class="welcome">WELCOME TO</p>
                    <h1>Karan calci <span>✦</span></h1>
                    <p class="subtitle">Smart Calculation Experience</p>
                </div>

                <div class="logo">✧</div>

            </div>


            <!-- Display Section -->

            <div class="display-box">

                <div class="display-top">
                    <span>YOUR CALCULATION</span>
                    <span class="live">● LIVE</span>
                </div>

                <div id="question">Ready to calculate...</div>

                <div class="answer-row">

                    <div id="display">0</div>

                    <button class="copy-btn"
                        onclick="copyResult()"
                        title="Copy Result">
                        ▢
                    </button>

                </div>

            </div>


            <!-- Calculator Buttons -->

            <div class="buttons">

                <button class="special" onclick="clearDisplay()">AC</button>
                <button class="special" onclick="deleteLast()">DEL</button>
                <button class="operator" onclick="addValue('%')">%</button>
                <button class="operator" onclick="addValue('/')">÷</button>

                <button onclick="addValue('7')">7</button>
                <button onclick="addValue('8')">8</button>
                <button onclick="addValue('9')">9</button>
                <button class="operator" onclick="addValue('*')">×</button>

                <button onclick="addValue('4')">4</button>
                <button onclick="addValue('5')">5</button>
                <button onclick="addValue('6')">6</button>
                <button class="operator" onclick="addValue('-')">−</button>

                <button onclick="addValue('1')">1</button>
                <button onclick="addValue('2')">2</button>
                <button onclick="addValue('3')">3</button>
                <button class="operator" onclick="addValue('+')">+</button>

                <button class="zero" onclick="addValue('0')">0</button>
                <button onclick="addValue('.')">.</button>
                <button class="equal" onclick="calculate()">=</button>

            </div>


            <!-- Keyboard Information -->

            <p class="keyboard-info">
                ⌨ Keyboard Supported
            </p>


            <!-- Footer -->

            <div class="bottom-text">
                Crafted with <span>♥</span> & a little bit of logic
                <p>KEEP CALCULATING • KEEP CREATING</p>
            </div>

        </div>


        <!-- History Section -->

        <div class="history-box">

            <div class="history-header">

                <div>
                    <p class="history-small">YOUR ACTIVITY</p>
                    <h2>History</h2>
                </div>

                <button class="clear-history" onclick="clearHistory()">
                    Clear All
                </button>

            </div>


            <!-- History List -->

            <div id="history-list">

                <p class="empty-history">
                    Your calculations will appear here.
                </p>

            </div>


            <div class="history-footer">
                LUMORA • SMART & SIMPLE
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
